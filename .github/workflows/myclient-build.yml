# Unofficial client (myclient) tooling. Not part of upstream Telegram for Android.
#
# Builds an arm64-v8a debug APK to check that the project compiles.
# No real api_id/api_hash is used here, so this APK cannot log in.
name: myclient-build

on:
  push:
    branches:
      - 'myclient/**'
    paths-ignore:
      - '**/*.md'
      - '.github/**'
      - 'myclient/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: myclient-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Check out the branch head with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Write local.properties (no real credentials)
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble the debug APK (arm64-v8a only)
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug -PmyclientAbi=arm64-v8a --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: myclient-debug-arm64
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7
