# Unofficial client (myclient) tooling. Not part of upstream Telegram for Android.
#
# Applies queued anchored edits (myclient/edits/*.edit) as separate commits,
# then builds the result. See myclient/edits/README.md.
name: myclient-apply-edits

on:
  push:
    branches:
      - 'myclient/**'
    paths:
      - 'myclient/edits/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: myclient-apply-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      applied: ${{ steps.apply.outputs.applied }}
      failed: ${{ steps.apply.outputs.failed }}
    steps:
      - name: Check out the branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the person who queued the edits as the commit author.
          echo "GIT_AUTHOR_NAME=$(git log -1 --format=%an)" >> "$GITHUB_ENV"
          echo "GIT_AUTHOR_EMAIL=$(git log -1 --format=%ae)" >> "$GITHUB_ENV"

      - name: Apply queued edits
        id: apply
        run: python3 myclient/tools/apply_edits.py

      - name: Push the new commits
        if: steps.apply.outputs.applied == 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}). Rebasing on the latest branch head."
            git pull --rebase --depth=50 origin "${GITHUB_REF_NAME}"
            sleep 5
          done
          exit 1

      - name: Fail if an edit did not apply
        if: steps.apply.outputs.failed == 'true'
        run: |
          echo "An edit file did not apply. See the 'Apply queued edits' step."
          exit 1

  build:
    needs: apply
    if: always() && needs.apply.outputs.applied == 'true'
    uses: ./.github/workflows/myclient-build.yml
